name: build-tyfza1

# ============================================================
# 天翼 TYFZA1（Realtek RTL9617C，4×Cortex-A55，Linux 6.18.55）
# 与 XG-040G-MD（Airoha AN7581）不是同一个 target，必须独立一条构建线。
#   源码：openwrt/openwrt@<他们 sources.lock.json 锁的 commit>
#   端口：LeoooChen/PonWRT-TYFZA1@<pins.env 锁的 SHA>（按 SHA 取，不 fork）
#   构建配方照抄该仓库 .github/workflows/build-release.yml 的步骤，
#   差别只有：不发布他们的 Release（我们发自己的 tag）、跳过需要私有素材的分支。
# ============================================================

on:
  workflow_dispatch:
    # 没有开关：这台机器要加的就是 eBPF/BTF + honk + 我自己的主题，
    # stage-tyfza1.sh 三件都会放，成品断言也按这三件查。

permissions:
  contents: write
  pages: write

env:
  TYFZA1_WORK: ${{ github.workspace }}/tyfza1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { path: ctrl }

      - name: Load pins
        run: |
          set -euo pipefail
          set -a; . ./ctrl/pins.env; set +a
          echo "TYFZA1_URL=$TYFZA1_URL" >> "$GITHUB_ENV"
          echo "TYFZA1_SHA=$TYFZA1_SHA" >> "$GITHUB_ENV"
          echo "锁版本：$TYFZA1_URL @ $TYFZA1_SHA"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -hT /

      - name: Install build dependencies
        # 抄他们 workflow 的包列表（rtl9617c 的无线/PE 部件要 clang-18/llvm-18/lld-18）
        run: |
          sudo apt-get -qq update -o Acquire::Retries=3
          sudo apt-get install -y build-essential busybox clang-18 llvm-18 lld-18 flex bison gawk \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip \
            zlib1g-dev file wget curl device-tree-compiler u-boot-tools swig \
            libelf-dev python3-pyelftools python3-dev libfuse-dev pkgconf cmake ninja-build ccache

      - name: Clone port repo at pinned SHA
        run: |
          set -euo pipefail
          git clone -q "$TYFZA1_URL" "$TYFZA1_WORK"
          git -C "$TYFZA1_WORK" fetch -q --depth 1 origin "$TYFZA1_SHA"
          git -C "$TYFZA1_WORK" checkout -q FETCH_HEAD
          test -f "$TYFZA1_WORK/port/scripts/build.sh"
          echo "= $(git -C "$TYFZA1_WORK" rev-parse --short HEAD) 版本 $(cat "$TYFZA1_WORK/VERSION")"

      - name: OMCI compiler (rust pinned by their workflow)
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 aarch64-unknown-linux-musl
          echo "TYFZA1_CARGO=$(rustup which --toolchain 1.96.1 cargo)" >> "$GITHUB_ENV"

      - name: Runtime inputs (their public release artifact)
        run: |
          set -euo pipefail
          cd "$TYFZA1_WORK"
          mkdir -p artifacts/runtime-inputs
          # 他们的 build.sh 在没有 TYFZA1_RUNTIME_INPUTS 时会去找 analysis/private/*
          # （私有原厂素材）→ CI 里必须用这个公开的素材包
          curl -fsSL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o artifacts/tyfza1-runtime-inputs-v1.tar.gz \
            "https://github.com/LeoooChen/PonWRT-TYFZA1/releases/download/v0.1.0-alpha/tyfza1-runtime-inputs-v1.tar.gz"
          tar -xzf artifacts/tyfza1-runtime-inputs-v1.tar.gz -C artifacts/runtime-inputs
          echo "runtime-inputs: $(ls artifacts/runtime-inputs | tr '\n' ' ')"
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

      - name: FIT signing key (public, sha256 pinned)
        run: |
          set -euo pipefail
          cd "$TYFZA1_WORK"
          mkdir -p artifacts/signing
          # 与上游一致：key 来自公开的 GPL-for-GP3000，且带 sha256 校验。
          # 他们的原生 U-Boot 验证启动认的就是这把公开 key，换成我们自己的会验不过。
          curl -fsSL --retry 3 --max-time 120 -o artifacts/signing/dev.key \
            https://raw.githubusercontent.com/jameywine/GPL-for-GP3000/5090fbcb6ba743dd7b1314811ef557bad0460147/bootloader/Verified_Boot/verifed_key_06-04-2020/dev.key
          echo 'bea80932793531fe263f62bf4de3ee95754ea7b9766eda23a418c22f06ce127f  artifacts/signing/dev.key' | sha256sum -c -
          openssl req -new -x509 -key artifacts/signing/dev.key -out artifacts/signing/dev.crt -subj /CN=TYFZA1-FIT -days 3650

      - name: Obtain locked OpenWrt source
        run: |
          set -euo pipefail
          cd "$TYFZA1_WORK"
          sh port/scripts/prepare.sh sources/openwrt
          echo "openwrt = $(git -C sources/openwrt rev-parse --short HEAD)"
          grep -oE '"commit": *"[0-9a-f]+"' port/sources.lock.json | head -1

      - name: Stage our additions (BTF + honk + lucent theme)
        # 用上游自己留的 TYFZA1_CONFIG 扩展点：派生 config = 他们的 tyfza1-boot.config
        # + 我们那几行；包放进 sources/openwrt/package/custom/，不碰他们任何文件。
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/ctrl/scripts/stage-tyfza1.sh" \
            "$TYFZA1_WORK/sources/openwrt" "$TYFZA1_WORK" \
            "$GITHUB_WORKSPACE/ctrl" "$TYFZA1_WORK/artifacts/custom.config"

      - name: Answer kernel symbols unmasked by BTF/FTRACE
        # 上一轮真错误：内核 syncconfig 走到
        #   TYFZA1 USB presence and activity LED (LEDS_TRIGGER_TYFZA1_USB) [N/m/?] (NEW)
        #   scripts/kconfig/Makefile:85: syncconfig Error 1
        # 我们把 DEBUG_INFO/BTF/FTRACE 打开后，被"解锁"出来的新符号在 rtl9617c 的
        # 内核种子配置里没有答案；而 OpenWrt 编内核时带 FAIL_ON_UNCONFIGURED=1
        # （include/kernel-build.mk:178），syncconfig 见 NEW 就报错，不会自己取默认值。
        # 官方对策就是 make target/linux/oldconfig：用默认值回答，再把结果写回种子
        # （include/target.mk:181 LINUX_RECONFIG_TARGET = target/linux/<tail>/config-*）。
        # 只改 CI 工作树里那份种子，上游仓库一个字不动。
        run: |
          set -euo pipefail
          cd "$TYFZA1_WORK/sources/openwrt"
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          # 上一轮这一步死在 make tools/install：.config 还没展开过，toplevel.mk 把它
          # 当过期目标，转手调 menuconfig，CI 无终端 → "Error opening terminal: unknown"。
          # 上游 build.sh 自己第 33 行就是 make defconfig，我们只是提前做同一件事
          # （defconfig 只补没答案的符号，不动我们写进去的那些）。
          make defconfig </dev/null > "$TYFZA1_WORK/defconfig.log" 2>&1 || {
            echo "::error::make defconfig 失败"; tail -40 "$TYFZA1_WORK/defconfig.log"; exit 1; }
          grep -qx 'CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config \
            || { echo "::error::defconfig 把 BTF 丢了（片段没生效？）"; exit 1; }
          echo "✅ defconfig 后 BTF 仍在（.config $(grep -c '^CONFIG_' .config) 条）"
          make tools/install -j"$(nproc)" > "$TYFZA1_WORK/oldconfig-tools.log" 2>&1 || {
            echo "::error::tools/install 失败"; tail -40 "$TYFZA1_WORK/oldconfig-tools.log"; exit 1; }
          make target/linux/oldconfig -j1 V=s </dev/null > "$TYFZA1_WORK/oldconfig.log" 2>&1 || {
            echo "::error::make target/linux/oldconfig 失败（V=s 全量日志如下）"
            echo "----- 日志 $(wc -l < "$TYFZA1_WORK/oldconfig.log") 行；先给错误行 -----"
            grep -nE '\*\*\*|[Ee]rror|No rule|not found|cannot|Permission' \
              "$TYFZA1_WORK/oldconfig.log" | head -25 || true
            echo "----- 全量（末尾 200 行）-----"
            tail -200 "$TYFZA1_WORK/oldconfig.log"
            echo "----- 现场 -----"
            ls -l dl/ 2>/dev/null | grep -iE 'linux|6\.18' | head -5 || echo "dl/ 里没有内核包"
            ls staging_dir/host/bin 2>/dev/null | grep -E '^(bison|flex|perl|quilt|patch)' | tr '\n' ' ' || echo "（host bin 里没有 kconfig 要用的工具）"; echo
            ls -d build_dir/*/linux-* 2>/dev/null || echo "（内核还没解包/打补丁）"
            exit 1; }
          echo "=== 种子配置因此新增的行（只在工作树里）==="
          git diff --stat -- target/linux || true
          git diff -- target/linux | grep -E '^\+[^+]' | head -25 || true
          # 权威判据用 oldconfig 生成出来的那份内核 .config（种子可能落在 target 级
          # 也可能落在 generic 子目标级，逐个翻文件反而容易认错）。
          KC=$(find build_dir -maxdepth 4 -type f -name .config -path '*linux-6.18*' | head -1)
          [ -n "$KC" ] || { echo "::error::找不到 oldconfig 生成的内核 .config"; ls -d build_dir/*/linux-* 2>/dev/null; exit 1; }
          echo "=== $KC 里的关键答案 ==="
          grep -E '^CONFIG_(DEBUG_INFO|DEBUG_INFO_BTF|FTRACE|FUNCTION_TRACER|DYNAMIC_FTRACE|BPF_EVENTS)=y|^# CONFIG_DEBUG_INFO_REDUCED is not set' "$KC"
          grep -q '^CONFIG_DEBUG_INFO=y' "$KC" || { echo "::error::内核 DEBUG_INFO 没被回答，BTF 不会生效"; exit 1; }
          grep -q '^CONFIG_DEBUG_INFO_BTF=y' "$KC" || { echo "::error::内核 BTF 没被回答，honk 起不来"; exit 1; }
          echo "✅ 内核符号已全部有答案（下一步不会再卡在 syncconfig）"

      - name: Build OpenWrt and native PE
        run: |
          set -euo pipefail
          cd "$TYFZA1_WORK"
          export TYFZA1_RUNTIME_INPUTS="$PWD/artifacts/runtime-inputs"
          export TYFZA1_SIGNING_KEYS="$PWD/artifacts/signing"
          export TYFZA1_CONFIG="$PWD/artifacts/custom.config"
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          echo "注入 config：$(grep -c '^CONFIG_' "$TYFZA1_CONFIG") 条；我们追加的部分："
          sed -n '/ponwrt-xg040gmd 追加/,$p' "$TYFZA1_CONFIG" | head -30
          # 完整日志必须留盘：上一轮只 tail -60，真错误被截掉了，只能看见
          # "ERROR: target/linux failed to build" 这一行没法定位。
          if sh port/scripts/build.sh sources/openwrt "$(nproc)" > artifacts/build-full.log 2>&1; then
            tail -40 artifacts/build-full.log
          else
            rc=$?
            echo "=== build.sh 失败 rc=$rc，日志里的错误上下文 ==="
            grep -nE 'error:|Error [0-9]|No rule|undefined reference|overflowed|too big|not enough space' \
              artifacts/build-full.log | head -30 || true
            echo "=== 出错点前后 60 行 ==="
            LN=$(grep -nE 'ERROR: .* failed to build|Error [0-9]+' artifacts/build-full.log | tail -1 | cut -d: -f1 || true)
            if [ -n "${LN:-}" ]; then sed -n "$((LN>60 ? LN-60 : 1)),$((LN+10))p" artifacts/build-full.log; else tail -80 artifacts/build-full.log; fi
            echo "=== 就地用 -j1 V=s 重跑失败的那部分，拿真实编译错误 ==="
            cd sources/openwrt
            if grep -q 'ERROR: target/linux' ../../artifacts/build-full.log; then
              make target/compile -j1 V=s 2>&1 | tail -100
            elif grep -q 'ERROR: package/' ../../artifacts/build-full.log; then
              PKG=$(grep -oE 'ERROR: package/[^ ]+' ../../artifacts/build-full.log | tail -1 | cut -d' ' -f2)
              echo "重跑 $PKG"
              make "package/$PKG/compile" -j1 V=s 2>&1 | tail -100
            fi
            exit 1
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tyfza1-build-log-${{ github.run_id }}
          path: |
            tyfza1/artifacts/build-full.log
            tyfza1/artifacts/custom.config
          if-no-files-found: ignore
          retention-days: 14

      - name: ASSERT images and our additions
        run: |
          set -euo pipefail
          cd "$TYFZA1_WORK"
          python3 scripts/test_board_variants.py --kernel "$(python3 port/tools/project_paths.py --kernel-directory sources/openwrt)" \
            || echo "::warning::上游机型变体自检没过（不是我们引入的话，继续看产物）"
          N=$(find sources/openwrt/bin -name '*sysupgrade*.bin' 2>/dev/null | wc -l)
          [ "$N" -ge 1 ] || { echo "::error::没产出 sysupgrade.bin"; find sources/openwrt/bin -maxdepth 4 -type d | head -20; exit 1; }
          echo "✅ sysupgrade 镜像 $N 个"
          echo "=== 1) 内核里必须有 .BTF（honk 的硬前提）==="
          VML=$(find sources/openwrt/build_dir -maxdepth 5 -type f -name vmlinux -path '*/linux-*/*' | head -1)
          [ -n "$VML" ] || { echo "::error::找不到 vmlinux"; exit 1; }
          readelf -S "$VML" | grep -E '\.BTF( |_])' || { echo "::error::vmlinux 没有 .BTF 段 → BTF 没生效"; exit 1; }
          echo "✅ .BTF 在 $VML"
          echo "=== 2) rootfs 的 apk 库里必须有我们加的包 ==="
          # root-rtl9617c 在 build_dir/target-*/ 下面（深度 2）
          ROOTFS=$(find sources/openwrt/build_dir -maxdepth 2 -type d -name 'root-rtl9617c*' | head -1)
          [ -n "$ROOTFS" ] || ROOTFS=$(find sources/openwrt/build_dir -maxdepth 2 -type d -name 'root-*' | head -1)
          DB="$ROOTFS/lib/apk/db/installed"
          [ -s "$DB" ] || { echo "::error::没有 apk 数据库 $DB，无法核对"; exit 1; }
          MISS=""
          for p in honk luci-app-honk luci-lib-daeuniverse luci-theme-lucent kmod-sched-core kmod-nft-queue kmod-nfnetlink-queue v2ray-geosite; do
            grep -qE "^P:$p$" "$DB" || MISS="$MISS $p"
          done
          [ -z "$MISS" ] || { echo "::error::镜像里缺这些包:$MISS"; exit 1; }
          echo "✅ 我们加的包都在镜像里（apk 库共 $(grep -c '^P:' "$DB") 条）"
          echo "=== 3) 实体文件 ==="
          for f in usr/bin/honk-core etc/init.d/honk usr/lib/luci-theme-lucent; do
            [ -e "$ROOTFS/$f" ] || echo "· 注：$f 不在此路径（主题资源在 www/ 与 usr/share/luci 下）"
          done
          [ -e "$ROOTFS/usr/bin/honk-core" ] || { echo "::error::rootfs 里没有 honk-core"; exit 1; }
          du -h "$ROOTFS/usr/bin/honk-core"

      - name: Package release artifacts
        run: |
          set -euo pipefail
          cd "$TYFZA1_WORK"
          mkdir -p artifacts/release
          sh scripts/package_release.sh sources/openwrt artifacts/release
          ls -la artifacts/release
          (cd artifacts/release && sha256sum * 2>/dev/null | tee SHA256SUMS.local)

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tyfza1-plus
          name: 'TYFZA1 (RTL9617C) 上游 + BTF/honk/Lucent 主题'
          body: |
            基座完全按上游：<https://github.com/LeoooChen/PonWRT-TYFZA1@${{ env.TYFZA1_SHA }}>
            （按 SHA 取，非 fork；其 sources.lock.json 锁的 openwrt commit + kernel 6.18.55）。
            只额外加三样，且不改上游任何文件（用他们自己留的 TYFZA1_CONFIG 扩展点派生 config）：
            1. 内核 BTF + honk 需要的 eBPF/TC 模块
            2. honk（daeuniverse）：官方 release 静态二进制包 + luci-app-honk + luci-lib-daeuniverse
            3. 主题 luci-theme-lucent（argon 仍在，按上游要求保留）
            RTL9617C 与 AN7581 是不同 target，本产物只用于 TYFZA1。
            刷入见上游 README：先装他们的原生 U-Boot，恢复页 http://192.168.0.1。
          files: ${{ github.workspace }}/tyfza1/artifacts/release/*
          fail_on_unmatched_files: false

      - name: Summary
        if: always()
        run: |
          {
            echo "## TYFZA1 构建"
            echo "- 端口锁到 \`$TYFZA1_SHA\`"
            echo "- 基座上游锁定 \`$TYFZA1_SHA\`；追加仅三项：BTF/eBPF、honk、luci-theme-lucent"
            echo "- 产物 Release：<https://github.com/${GITHUB_REPOSITORY}/releases/tag/tyfza1-plus>"
            echo "- 构建后已断言：vmlinux 含 .BTF、rootfs apk 库含 honk 三件与主题"
          } >> "$GITHUB_STEP_SUMMARY"
