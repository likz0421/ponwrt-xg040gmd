name: build-tyfza1

# ============================================================
# 天翼 TYFZA1（Realtek RTL9617C，4×Cortex-A55，Linux 6.18.55）
# 与 XG-040G-MD（Airoha AN7581）不是同一个 target，必须独立一条构建线。
#   源码：openwrt/openwrt@<他们 sources.lock.json 锁的 commit>
#   端口：LeoooChen/PonWRT-TYFZA1@<pins.env 锁的 SHA>（按 SHA 取，不 fork）
#   构建配方照抄该仓库 .github/workflows/build-release.yml 的步骤，
#   差别只有：不发布他们的 Release（我们发自己的 tag）、跳过需要私有素材的分支。
# ============================================================

on:
  workflow_dispatch:
    # 没有开关：这台机器要加的就是 eBPF/BTF + honk + 我自己的主题，
    # stage-tyfza1.sh 三件都会放，成品断言也按这三件查。

permissions:
  contents: write
  pages: write

env:
  TYFZA1_WORK: ${{ github.workspace }}/tyfza1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { path: ctrl }

      - name: Load pins
        run: |
          set -euo pipefail
          set -a; . ./ctrl/pins.env; set +a
          echo "TYFZA1_URL=$TYFZA1_URL" >> "$GITHUB_ENV"
          echo "TYFZA1_SHA=$TYFZA1_SHA" >> "$GITHUB_ENV"
          echo "锁版本：$TYFZA1_URL @ $TYFZA1_SHA"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -hT /

      - name: Install build dependencies
        # 抄他们 workflow 的包列表（rtl9617c 的无线/PE 部件要 clang-18/llvm-18/lld-18）
        run: |
          sudo apt-get -qq update -o Acquire::Retries=3
          sudo apt-get install -y build-essential busybox clang-18 llvm-18 lld-18 flex bison gawk \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip \
            zlib1g-dev file wget curl device-tree-compiler u-boot-tools swig \
            libelf-dev python3-pyelftools python3-dev libfuse-dev pkgconf cmake ninja-build ccache

      - name: Clone port repo at pinned SHA
        run: |
          set -euo pipefail
          git clone -q "$TYFZA1_URL" "$TYFZA1_WORK"
          git -C "$TYFZA1_WORK" fetch -q --depth 1 origin "$TYFZA1_SHA"
          git -C "$TYFZA1_WORK" checkout -q FETCH_HEAD
          test -f "$TYFZA1_WORK/port/scripts/build.sh"
          echo "= $(git -C "$TYFZA1_WORK" rev-parse --short HEAD) 版本 $(cat "$TYFZA1_WORK/VERSION")"

      - name: OMCI compiler (rust pinned by their workflow)
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 aarch64-unknown-linux-musl
          echo "TYFZA1_CARGO=$(rustup which --toolchain 1.96.1 cargo)" >> "$GITHUB_ENV"

      - name: Runtime inputs (their public release artifact)
        run: |
          set -euo pipefail
          cd "$TYFZA1_WORK"
          mkdir -p artifacts/runtime-inputs
          # 他们的 build.sh 在没有 TYFZA1_RUNTIME_INPUTS 时会去找 analysis/private/*
          # （私有原厂素材）→ CI 里必须用这个公开的素材包
          curl -fsSL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o artifacts/tyfza1-runtime-inputs-v1.tar.gz \
            "https://github.com/LeoooChen/PonWRT-TYFZA1/releases/download/v0.1.0-alpha/tyfza1-runtime-inputs-v1.tar.gz"
          tar -xzf artifacts/tyfza1-runtime-inputs-v1.tar.gz -C artifacts/runtime-inputs
          echo "runtime-inputs: $(ls artifacts/runtime-inputs | tr '\n' ' ')"
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

      - name: FIT signing key (public, sha256 pinned)
        run: |
          set -euo pipefail
          cd "$TYFZA1_WORK"
          mkdir -p artifacts/signing
          # 与上游一致：key 来自公开的 GPL-for-GP3000，且带 sha256 校验。
          # 他们的原生 U-Boot 验证启动认的就是这把公开 key，换成我们自己的会验不过。
          curl -fsSL --retry 3 --max-time 120 -o artifacts/signing/dev.key \
            https://raw.githubusercontent.com/jameywine/GPL-for-GP3000/5090fbcb6ba743dd7b1314811ef557bad0460147/bootloader/Verified_Boot/verifed_key_06-04-2020/dev.key
          echo 'bea80932793531fe263f62bf4de3ee95754ea7b9766eda23a418c22f06ce127f  artifacts/signing/dev.key' | sha256sum -c -
          openssl req -new -x509 -key artifacts/signing/dev.key -out artifacts/signing/dev.crt -subj /CN=TYFZA1-FIT -days 3650

      - name: Obtain locked OpenWrt source
        run: |
          set -euo pipefail
          cd "$TYFZA1_WORK"
          sh port/scripts/prepare.sh sources/openwrt
          echo "openwrt = $(git -C sources/openwrt rev-parse --short HEAD)"
          grep -oE '"commit": *"[0-9a-f]+"' port/sources.lock.json | head -1

      - name: Stage our additions (BTF + honk + lucent theme)
        # 用上游自己留的 TYFZA1_CONFIG 扩展点：派生 config = 他们的 tyfza1-boot.config
        # + 我们那几行；包放进 sources/openwrt/package/custom/，不碰他们任何文件。
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/ctrl/scripts/stage-tyfza1.sh" \
            "$TYFZA1_WORK/sources/openwrt" "$TYFZA1_WORK" \
            "$GITHUB_WORKSPACE/ctrl" "$TYFZA1_WORK/artifacts/custom.config"

      - name: Answer kernel symbols unmasked by BTF/FTRACE
        # 现象：内核 syncconfig 停在
        #   TYFZA1 USB presence and activity LED (LEDS_TRIGGER_TYFZA1_USB) [N/m/?] (NEW)
        #   scripts/kconfig/Makefile:85: syncconfig Error 1
        # 我们打开 DEBUG_INFO/BTF/FTRACE 后，被"解锁"出来的符号在 rtl9617c 的内核种子里
        # 没有答案；OpenWrt 编内核带 FAIL_ON_UNCONFIGURED=1（include/kernel-build.mk），
        # syncconfig 见 NEW 直接报错，不会自己取默认值。
        # 试过 make kernel_oldconfig（入口名在 include/toplevel.mk:193，不是
        # target/linux/oldconfig —— 顶层只有 %:: 兜底，那个字符串会 "No rule to make target"），
        # 但它从**种子**重建 .config（include/target.mk:212），会把我们的 CONFIG_KERNEL_*
        # 覆盖丢掉：结果是 DEBUG_INFO 在、BTF 没了、种子一行没变 —— 白过。
        # 所以这里改成：先让 OpenWrt 自己做一次「种子 + 覆盖」的 configure，在那份 .config
        # 上补答，再用 kconfig.pl '>' 把差量写回种子。只动 CI 工作树，上游仓库一个字不改。
        run: |
          set -euo pipefail
          cd "$TYFZA1_WORK"
          export TYFZA1_CONFIG="$PWD/artifacts/custom.config"
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          # 上一轮 kernel_oldconfig 本身跑通了，但它答的是 **mediatek/filogic** 的种子：
          # port/scripts/prepare.sh 只 fetch 上游 openwrt@PIN，rtl9617c 这个 target 是
          # sync-overlay.sh 才 rsync 进去的（build.sh 第 25 行 sync-overlay → 26 行
          # prepare_luci_feeds → 33 行 make defconfig）。我们在 defconfig 之前没铺 overlay，
          # .config 就落回基线默认机型，答的自然是别人的内核配置。
          # 这里提前调同一条命令；它是幂等的（rsync --delete + 先 sed 删再 printf 追加），
          # 后面 build.sh 再执行一遍不会叠加。
          sh port/scripts/sync-overlay.sh sources/openwrt > sync-overlay.log 2>&1 || {
            echo "::error::上游 sync-overlay 失败"; tail -30 sync-overlay.log; exit 1; }
          [ -d sources/openwrt/target/linux/rtl9617c ] \
            || { echo "::error::overlay 之后仍然没有 target/linux/rtl9617c"; exit 1; }
          cd sources/openwrt
          # tools/install 之前必须先 defconfig：否则 toplevel.mk 把 .config 当过期目标，
          # 转手调 menuconfig，CI 无终端 → "Error opening terminal: unknown"。
          make defconfig </dev/null > "$TYFZA1_WORK/defconfig.log" 2>&1 || {
            echo "::error::make defconfig 失败"; tail -40 "$TYFZA1_WORK/defconfig.log"; exit 1; }
          grep -qx 'CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config \
            || { echo "::error::defconfig 把 BTF 丢了（片段没生效？）"; exit 1; }
          # 机型必须是我们那台，不然 oldconfig 答的是别的 target。
          # 用他们 boot config 里就有的符号（archived config.buildinfo 里没有
          # CONFIG_TARGET_BOARD 这种内部符号，拿它断言会假失败）。
          grep -q '^CONFIG_TARGET_rtl9617c=y' .config \
            || { echo "::error::.config 里没启用 rtl9617c：$(grep -m3 '^CONFIG_TARGET_' .config | tr '\n' ' ')"; exit 1; }
          grep -q '^CONFIG_TARGET_rtl9617c_generic=y' .config \
            || { echo "::error::.config 里没启用 rtl9617c/generic 子目标"; exit 1; }
          echo "✅ defconfig 后 BTF 仍在、机型为 rtl9617c（.config $(grep -c '^CONFIG_' .config) 条）"
          make tools/install -j"$(nproc)" > "$TYFZA1_WORK/oldconfig-tools.log" 2>&1 || {
            echo "::error::tools/install 失败"; tail -40 "$TYFZA1_WORK/oldconfig-tools.log"; exit 1; }
          # 不能用 kernel_oldconfig：它第一步是 LINUX_RECONF_CMD，从**种子**重建
          # $(LINUX_DIR)/.config（include/target.mk:212），把我们 CONFIG_KERNEL_* 的覆盖丢掉。
          # 上一轮的现象就是这么来的：DEBUG_INFO 还在（种子里本来就有）、BTF 没了、种子一行没改。
          # 我们要的是 kernel-defaults.mk:117-119 那份「种子 + 我们的覆盖」合成后的 .config，
          # 所以先真跑一次 configure（它会在 .modules 的 syncconfig 上按预期失败），
          # 循环：编一次 → 若失败是 kconfig 提 (NEW)，就把**这些被提问的符号**的答案写回种子 → 再编。
          # 上一轮的错误做法：用 kconfig.pl '>' 求「种子 vs 完整 .config」的全量差集写回 ——
          # 种子只有 652 行、完整 .config 六千行，差集 2887 行全是"种子本来就不必写的默认项"，
          # 那不是补答，是污染种子；第二次编译几秒就红了。
          echo "=== 1..n) 编译尝试 → 只补 (NEW) 提问过的符号 → 再试（最多 4 轮）==="
          HOSTBIN="$PWD/staging_dir/host/bin"
          [ -x "$HOSTBIN/pahole" ] || { echo "::error::$HOSTBIN/pahole 不存在（tools/dwarves 应由 CONFIG_DWARVES 编出）"; ls "$HOSTBIN" | grep -i pahole || true; exit 1; }
          echo "pahole：$("$HOSTBIN/pahole" --version | head -1)"
          SEED=""; BUILT=""; TRIES=0
          for i in 1 2 3 4; do
            log="$TYFZA1_WORK/kernel-try-$i.log"
            if make target/compile -j"$(nproc)" > "$log" 2>&1; then
              BUILT=1; echo "✅ 第 $i 次尝试：内核编过了"; break
            fi
            KD=$(find build_dir -maxdepth 4 -type d -name 'linux-6.18*' -path '*rtl9617c*' | head -1)
            [ -n "$KD" ] || { echo "::error::第 $i 次尝试后没有 rtl9617c 的内核构建目录"; tail -40 "$log"; exit 1; }
            [ -s "$KD/.config" ] || { echo "::error::第 $i 次：内核 .config 没生成（configure 没跑到）"; tail -40 "$log"; exit 1; }
            [ -n "$SEED" ] || SEED=$(find target/linux/rtl9617c -maxdepth 2 -type f -name 'config-*' | head -1)
            [ -n "$SEED" ] || { echo "::error::找不到 rtl9617c 的内核种子配置"; exit 1; }
            NEW=$(grep -oE '\(([A-Z][A-Z0-9_]*)\) \[[^]]*\] \(NEW\)' "$log" | sed -E 's/\) \[.*//; s/^\(//' | sort -u || true)
            if [ -z "$NEW" ]; then
              echo "::error::第 $i 次失败，但不是 kconfig 提问导致的 —— 真错误如下"
              grep -nE '\*\*\*|[Ee]rror:|No rule|cannot|undefined reference' "$log" | head -20 || true
              LN=$(grep -nE 'ERROR: |Error [0-9]' "$log" | tail -1 | cut -d: -f1 || true)
              if [ -n "${LN:-}" ]; then sed -n "$((LN>80 ? LN-80 : 1)),$((LN+15))p" "$log"; else tail -100 "$log"; fi
              echo "----- 再用 -j1 V=s 单跑一次拿完整上下文 -----"
              make target/compile -j1 V=s 2>&1 | tail -80 || true
              exit 1
            fi
            echo "第 $i 轮：kconfig 提问 $(printf '%s\n' "$NEW" | wc -l) 个符号：$(printf '%s ' $NEW)"
            # olddefconfig，不是 oldconfig：后者逐个提问，喂 </dev/null 会中途报错退出。
            # PATH 必须带 staging_dir/host/bin：6.18 lib/Kconfig.debug:382 是
            # `depends on PAHOLE_VERSION >= 116`，量不到 pahole 时 PAHOLE_VERSION=0，
            # kconfig 会把 DEBUG_INFO_BTF 当不可见符号静默丢掉。
            ( cd "$KD" && PATH="$HOSTBIN:$PATH" make ARCH=arm64 olddefconfig < /dev/null ) > "$TYFZA1_WORK/koldconfig-$i.log" 2>&1 || {
              echo "::error::olddefconfig 失败"; tail -40 "$TYFZA1_WORK/koldconfig-$i.log"; exit 1; }
            grep -qx 'CONFIG_DEBUG_INFO_BTF=y' "$KD/.config" || {
              echo "::error::olddefconfig 之后 BTF 不见了（依赖不成立或被覆盖丢掉）"
              grep -nE 'CONFIG_DEBUG_INFO|CONFIG_BPF_SYSCALL|CONFIG_PAHOLE' "$KD/.config" | head -14
              tail -30 "$TYFZA1_WORK/koldconfig-$i.log"; exit 1; }
            : > "$TYFZA1_WORK/seed-add.conf"
            for s in $NEW; do
              line=""
              v=$(grep -m1 -oE "^CONFIG_$s=.*" "$KD/.config" || true)
              if [ -n "$v" ]; then line="$v"
              elif grep -qxF "# CONFIG_$s is not set" "$KD/.config"; then line="# CONFIG_$s is not set"
              else echo "· 注：$s 在内核 .config 里没有可见答案（多半是无形式的派生符号）"; continue; fi
              grep -qxF "$line" "$SEED" && continue
              printf '%s\n' "$line" >> "$TYFZA1_WORK/seed-add.conf"
            done
            ADD=$(grep -c . "$TYFZA1_WORK/seed-add.conf" || true)
            if [ "${ADD:-0}" -gt 0 ]; then
              printf '\n# ponwrt：kconfig 提问过的符号，按默认值补答（仅本工作树，不改上游）\n' >> "$SEED"
              cat "$TYFZA1_WORK/seed-add.conf" >> "$SEED"
            fi
            TRIES=$i
            echo "  → 写回 $SEED：本轮 $ADD 行，种子现有 $(grep -c '^CONFIG_\|^# CONFIG_' "$SEED") 行"
            git diff --stat -- target/linux/rtl9617c || true
          done
          [ -n "$BUILT" ] || { echo "::error::$TRIES 轮补答后内核仍编不过"; tail -60 "$TYFZA1_WORK/kernel-try-4.log"; exit 1; }
          KC=$(find build_dir -maxdepth 5 -type f -name .config -path '*linux-rtl9617c*' | head -1)
          grep -E '^CONFIG_(DEBUG_INFO|DEBUG_INFO_BTF|FTRACE|FUNCTION_TRACER|DYNAMIC_FTRACE|BPF_EVENTS)=y|^# CONFIG_DEBUG_INFO_REDUCED is not set' "$KC"
          grep -q '^CONFIG_DEBUG_INFO_BTF=y' "$KC" || { echo "::error::重编后 BTF 又丢了（被 override 覆盖？$KC）"; exit 1; }
          # honk 的内核前提逐条查实（BPF/BPF_SYSCALL/BPF_JIT 来自 generic 种子，
          # NET_XGRESS 来自 rtl9617c 自己的种子；CGROUP_BPF 是 default y，
          # 只有生成出来的 .config 里才看得见，所以在这儿断言而不是猜）
          for s in CONFIG_BPF=y CONFIG_BPF_SYSCALL=y CONFIG_BPF_JIT=y CONFIG_NET_XGRESS=y CONFIG_CGROUP_BPF=y; do
            grep -qx "$s" "$KC" || { echo "::error::内核缺 honk 需要的前提：$s（$KC）"; grep -nE "^#? *CONFIG_(CGROUP_BPF|NET_XGRESS|BPF_SYSCALL)" "$KC" | head; exit 1; }
          done
          echo "✅ 内核带着 BTF 与 eBPF 前提编过了，build.sh 那步不会卡在 syncconfig"

      - name: Build OpenWrt and native PE
        run: |
          set -euo pipefail
          cd "$TYFZA1_WORK"
          export TYFZA1_RUNTIME_INPUTS="$PWD/artifacts/runtime-inputs"
          export TYFZA1_SIGNING_KEYS="$PWD/artifacts/signing"
          export TYFZA1_CONFIG="$PWD/artifacts/custom.config"
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          echo "注入 config：$(grep -c '^CONFIG_' "$TYFZA1_CONFIG") 条；我们追加的部分："
          sed -n '/ponwrt-xg040gmd 追加/,$p' "$TYFZA1_CONFIG" | head -30
          # 完整日志必须留盘：上一轮只 tail -60，真错误被截掉了，只能看见
          # "ERROR: target/linux failed to build" 这一行没法定位。
          if sh port/scripts/build.sh sources/openwrt "$(nproc)" > artifacts/build-full.log 2>&1; then
            tail -40 artifacts/build-full.log
          else
            rc=$?
            echo "=== build.sh 失败 rc=$rc，日志里的错误上下文 ==="
            grep -nE 'error:|Error [0-9]|No rule|undefined reference|overflowed|too big|not enough space' \
              artifacts/build-full.log | head -30 || true
            echo "=== 出错点前后 60 行 ==="
            LN=$(grep -nE 'ERROR: .* failed to build|Error [0-9]+' artifacts/build-full.log | tail -1 | cut -d: -f1 || true)
            if [ -n "${LN:-}" ]; then sed -n "$((LN>60 ? LN-60 : 1)),$((LN+10))p" artifacts/build-full.log; else tail -80 artifacts/build-full.log; fi
            echo "=== 就地用 -j1 V=s 重跑失败的那部分，拿真实编译错误 ==="
            cd sources/openwrt
            if grep -q 'ERROR: target/linux' ../../artifacts/build-full.log; then
              make target/compile -j1 V=s 2>&1 | tail -100
            elif grep -q 'ERROR: package/' ../../artifacts/build-full.log; then
              PKG=$(grep -oE 'ERROR: package/[^ ]+' ../../artifacts/build-full.log | tail -1 | cut -d' ' -f2)
              echo "重跑 $PKG"
              make "package/$PKG/compile" -j1 V=s 2>&1 | tail -100
            fi
            exit 1
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tyfza1-build-log-${{ github.run_id }}
          path: |
            tyfza1/artifacts/build-full.log
            tyfza1/artifacts/custom.config
          if-no-files-found: ignore
          retention-days: 14

      - name: ASSERT images and our additions
        run: |
          set -euo pipefail
          cd "$TYFZA1_WORK"
          python3 scripts/test_board_variants.py --kernel "$(python3 port/tools/project_paths.py --kernel-directory sources/openwrt)" \
            || echo "::warning::上游机型变体自检没过（不是我们引入的话，继续看产物）"
          N=$(find sources/openwrt/bin -name '*sysupgrade*.bin' 2>/dev/null | wc -l)
          [ "$N" -ge 1 ] || { echo "::error::没产出 sysupgrade.bin"; find sources/openwrt/bin -maxdepth 4 -type d | head -20; exit 1; }
          echo "✅ sysupgrade 镜像 $N 个"
          echo "=== 1) 内核里必须有 .BTF（honk 的硬前提）==="
          VML=$(find sources/openwrt/build_dir -maxdepth 5 -type f -name vmlinux -path '*/linux-*/*' | head -1)
          [ -n "$VML" ] || { echo "::error::找不到 vmlinux"; exit 1; }
          readelf -S "$VML" | grep -E '\.BTF( |_])' || { echo "::error::vmlinux 没有 .BTF 段 → BTF 没生效"; exit 1; }
          echo "✅ .BTF 在 $VML"
          echo "=== 2) 所有 rootfs 的 apk 库并集里必须有我们加的包 ==="
          # 与 XG 同一条经验：PER_DEVICE_ROOTFS=y 时机型专属包在 $(KDIR)/target-dir-<id>
          # （include/image.mk:38 的 mkfs_target_dir），不在 root-<board> 里。
          # 按目录名挑一份 rootfs 会把"镜像里有"误判成"没有"，所以找所有 apk 库求并集。
          DBS=$(find sources/openwrt/build_dir -maxdepth 7 -type f -path '*/lib/apk/db/installed' | sort)
          [ -n "$DBS" ] || { echo "::error::build_dir 里没有任何 apk installed 库"; exit 1; }
          ROOTS=$(printf '%s\n' "$DBS" | sed 's|/lib/apk/db/installed$||')
          for db in $DBS; do
            printf '    %s  共 %s 包  honk=%s lucent=%s\n' "${db%/lib/apk/db/installed}" \
              "$(grep -c '^P:' "$db")" "$(grep -cE '^P:honk$' "$db")" "$(grep -cE '^P:luci-theme-lucent$' "$db")"
          done
          MISS=""
          for p in honk luci-app-honk luci-lib-daeuniverse luci-theme-lucent kmod-sched-core kmod-nft-queue kmod-nfnetlink-queue v2ray-geosite; do
            grep -qsE "^P:$p$" $DBS || MISS="$MISS $p"
          done
          [ -z "$MISS" ] || { echo "::error::所有 rootfs 里都没有这些包:$MISS"; exit 1; }
          echo "✅ 我们加的包都在镜像里（并集判据，$(printf '%s\n' "$ROOTS" | wc -l) 份 rootfs）"
          echo "=== 3) 实体文件（同样按并集找）==="
          MISSBIN=""
          for f in usr/bin/honk-core etc/init.d/honk; do
            hit=""
            for r in $ROOTS; do [ -s "$r/$f" ] && { hit="$r/$f"; break; }; done
            [ -n "$hit" ] || MISSBIN="$MISSBIN $f"
          done
          [ -z "$MISSBIN" ] || { echo "::error::所有 rootfs 里都缺这些文件:$MISSBIN"; exit 1; }
          BIN=""
          for r in $ROOTS; do [ -s "$r/usr/bin/honk-core" ] && { BIN="$r/usr/bin/honk-core"; break; }; done
          echo "✅ honk-core 在镜像里：$BIN ($(du -h "$BIN" | cut -f1))"
          # 主题的静态资源路径由主题自己的 Makefile 决定，我们没核实过命名，
          # 所以这里只给警告，不做硬断言（apk 库里已经有 luci-theme-lucent 这条是硬判据）。
          THEMEDIR=""
          for r in $ROOTS; do
            d=$(find "$r/htdocs/luci-static" -maxdepth 1 -type d -name '*lucent*' 2>/dev/null | head -1 || true)
            [ -n "$d" ] && { THEMEDIR="$d"; break; }
          done
          [ -n "$THEMEDIR" ] && echo "✅ 主题静态资源：$THEMEDIR" \
            || echo "::warning::rootfs 里没按 *lucent* 命名找到主题资源，刷机后在 /www/htdocs/luci-static 下确认"

      - name: Package release artifacts
        run: |
          set -euo pipefail
          cd "$TYFZA1_WORK"
          mkdir -p artifacts/release
          sh scripts/package_release.sh sources/openwrt artifacts/release
          ls -la artifacts/release
          (cd artifacts/release && sha256sum * 2>/dev/null | tee SHA256SUMS.local)

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tyfza1-plus
          name: 'TYFZA1 (RTL9617C) 上游 + BTF/honk/Lucent 主题'
          body: |
            基座完全按上游：<https://github.com/LeoooChen/PonWRT-TYFZA1@${{ env.TYFZA1_SHA }}>
            （按 SHA 取，非 fork；其 sources.lock.json 锁的 openwrt commit + kernel 6.18.55）。
            只额外加三样，且不改上游任何文件（用他们自己留的 TYFZA1_CONFIG 扩展点派生 config）：
            1. 内核 BTF + honk 需要的 eBPF/TC 模块
            2. honk（daeuniverse）：官方 release 静态二进制包 + luci-app-honk + luci-lib-daeuniverse
            3. 主题 luci-theme-lucent（argon 仍在，按上游要求保留）
            RTL9617C 与 AN7581 是不同 target，本产物只用于 TYFZA1。
            刷入见上游 README：先装他们的原生 U-Boot，恢复页 http://192.168.0.1。
          files: ${{ github.workspace }}/tyfza1/artifacts/release/*
          fail_on_unmatched_files: false

      - name: Summary
        if: always()
        run: |
          {
            echo "## TYFZA1 构建"
            echo "- 端口锁到 \`$TYFZA1_SHA\`"
            echo "- 基座上游锁定 \`$TYFZA1_SHA\`；追加仅三项：BTF/eBPF、honk、luci-theme-lucent"
            echo "- 产物 Release：<https://github.com/${GITHUB_REPOSITORY}/releases/tag/tyfza1-plus>"
            echo "- 构建后已断言：vmlinux 含 .BTF、rootfs apk 库含 honk 三件与主题"
          } >> "$GITHUB_STEP_SUMMARY"
