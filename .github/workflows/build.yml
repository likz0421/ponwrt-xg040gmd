name: build-xg040gmd

# ============================================================
# XG-040G-MD（Airoha AN7581）稳定版构建
#   原则：源码按 pins.env 锁 SHA；配置 = 上游 configs/an7581.config + 我们的差异；
#         任何"要求的东西被 defconfig 静默剔除"都直接失败，不出静默残缺固件。
# ============================================================

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: '覆盖 pbs05/ponwrt 的 commit SHA（留空 = 用 pins.env 锁定的版本）'
        required: false
        default: ''
      publish_repo:
        description: '把包仓库发到 GitHub Pages（设备 apk 更新源）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pages: write
  actions: read

env:
  WORK: /workdir
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: ctrl

      # ---------- 1. 读取锁定的版本 ----------
      - name: Load pinned revisions
        id: pins
        run: |
          set -euo pipefail
          set -a; . ./ctrl/pins.env; set +a
          OVERRIDE='${{ inputs.source_sha }}'
          [ -n "$OVERRIDE" ] && PONWRT_SHA="$OVERRIDE"
          for v in PONWRT_URL PONWRT_SHA PON_DRIVERS_URL PON_DRIVERS_SHA \
                   PON_USERSPACE_URL PON_USERSPACE_SHA LUCI_APP_URL LUCI_APP_SHA \
                   THEME_URL THEME_SHA; do
            [ -n "${!v:-}" ] || { echo "::error::pins.env 缺 $v"; exit 1; }
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          echo "基座      : $PONWRT_URL @ $PONWRT_SHA"
          echo "pon驱动   : @ $PON_DRIVERS_SHA"
          echo "pon用户态 : @ $PON_USERSPACE_SHA"
          echo "LuCI插件  : @ $LUCI_APP_SHA"

      # ---------- 2. 磁盘 + 依赖 ----------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -hT /

      - name: Install build essentials
        run: |
          sudo apt-get -qq update -o Acquire::Retries=3
          PKGS="build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib \
                gettext git libncurses-dev libssl-dev libelf-dev python3 python3-ply \
                python3-setuptools rsync swig unzip zlib1g-dev file wget curl ccache cmake \
                device-tree-compiler fastjar libglib2.0-dev libltdl-dev libmpc-dev libmpfr-dev \
                pkgconf qpdf squashfs-tools zstd libz-dev patch diffutils"
          # 逐包补齐：个别包在 Ubuntu 24.04 改名/移除时不该拖挂整个构建
          sudo apt-get install -y --no-install-recommends $PKGS || {
            for p in $PKGS; do
              dpkg -s "$p" >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends "$p" || echo "跳过缺失包: $p"
            done
          }
          # 注意：不装发行版的 dwarves/pahole。内核 BTF 用的是 OpenWrt 自己按
          # CONFIG_DWARVES 编出来的 tools/dwarves（版本随源码树锁定，可复现）。

      # ---------- 3. 取上游源码（按 SHA，不是 fork）----------
      - name: Fetch pinned source
        run: |
          set -euo pipefail
          sudo mkdir -p "$WORK" && sudo chown "$(id -u):$(id -g)" "$WORK"
          git init -q "$WORK/openwrt"
          cd "$WORK/openwrt"
          git remote add origin "$PONWRT_URL"
          git fetch --depth 1 origin "$PONWRT_SHA"
          git checkout -q FETCH_HEAD
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "HEADLINE=$(git log -1 --format=%s)" >> "$GITHUB_ENV"
          echo "源码 = $(git rev-parse --short HEAD) $(git log -1 --format=%cd --date=short)"
          echo "主题 = $(git log -1 --format=%s)"

      # ---------- 4. feeds：先 update，再把两个 pon feed 钉到 SHA，最后 install ----------
      - name: Update and pin feeds
        run: |
          set -euo pipefail
          cd "$WORK/openwrt"
          ./scripts/feeds update -a
          pin() {  # pin <feed目录> <sha>
            [ -d "feeds/$1/.git" ] || { echo "::error::feed $1 不存在，检查 feeds.conf.default"; exit 1; }
            git -C "feeds/$1" fetch -q --depth 1 origin "$2"
            git -C "feeds/$1" checkout -q FETCH_HEAD
            echo "feeds/$1 -> $(git -C feeds/$1 rev-parse --short HEAD)"
          }
          pin pon_drivers    "$PON_DRIVERS_SHA"
          pin pon_userspace  "$PON_USERSPACE_SHA"
          ./scripts/feeds install -a
          echo "REVISIONS: packages=$(git -C feeds/packages rev-parse --short HEAD) \
          luci=$(git -C feeds/luci rev-parse --short HEAD) \
          drivers=$(git -C feeds/pon_drivers rev-parse --short HEAD) \
          userspace=$(git -C feeds/pon_userspace rev-parse --short HEAD)"

      # ---------- 5. 两个 LuCI 插件进 package/custom ----------
      - name: Fetch LuCI plugins
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/ctrl/scripts/fetch-plugins.sh" "$WORK/openwrt"

      # ---------- 6. 还原稳定签名密钥（决定"以后能不能跨轮更新"）----------
      - name: Restore signing key
        env:
          # 必须是 workflow 级显式注入：GitHub 不会自动把 Secret 变成环境变量，
          # 这正是上一轮 fork 里那个脚本静默没执行的原因之一。
          PONWRT_SIGNING_KEYS: ${{ secrets.PONWRT_SIGNING_KEYS }}
        run: bash "$GITHUB_WORKSPACE/ctrl/scripts/restore-signing-key.sh" "$WORK/openwrt"

      # ---------- 7. 铺 rootfs 覆盖文件 + 组 .config ----------
      - name: Assemble configuration
        run: |
          set -euo pipefail
          cd "$WORK/openwrt"
          mkdir -p files
          cp -a "$GITHUB_WORKSPACE/ctrl/files/." files/
          chmod +x files/etc/uci-defaults/* 2>/dev/null || true
          # 把自建源地址按本仓库写死进镜像（Pages 由后面的步骤发布）
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          PAGES="https://${OWNER}.github.io/${REPO}"
          echo "自建源: $PAGES"
          # 用 printf 不用 heredoc：GitHub 的 run 块整段缩进，heredoc 会把缩进写进文件
          # 每条都要对应 Pages 上真实存在的 packages.adb（目录布局与官方 release 一致，
          # 已用 ImmortalWrt 快照实测：targets/…/packages 与 packages/<arch>/<feed> 都有 .adb）。
          # 只列确定非空的 feed：没被选中的 feed 不产包，目录里没有 .adb，列了会让
          # apk update 报错。下面「ASSERT package indexes」保证这四条永远不会 404。
          printf '%s\n' \
            '# 本仓库 GitHub Pages 包仓库（密钥固定，可与固件同轮或跨轮更新）' \
            "@ponwrt $PAGES/targets/airoha/an7581/packages/packages.adb" \
            "@ponwrt-pkg $PAGES/packages/aarch64_cortex-a53/base/packages.adb" \
            "@ponwrt-luci $PAGES/packages/aarch64_cortex-a53/luci/packages.adb" \
            "@ponwrt-pon_drivers $PAGES/packages/aarch64_cortex-a53/pon_drivers/packages.adb" \
            "@ponwrt-pon_userspace $PAGES/packages/aarch64_cortex-a53/pon_userspace/packages.adb" \
            > files/etc/apk/repositories.d/ponwrt.list
          if [ '${{ inputs.publish_repo }}' != 'true' ]; then
            sed -i 's/^@ponwrt/# @ponwrt/' files/etc/apk/repositories.d/ponwrt.list
          fi
          # 基座 = 上游全量 defconfig；差异 = 我们的符号（后写覆盖先写）
          test -f configs/an7581.config
          cp configs/an7581.config .config
          cat "$GITHUB_WORKSPACE/ctrl/configs/xg-040g-md.diff.config" >> .config
          echo "基座 $(wc -l < configs/an7581.config) 行；差异追加 $(grep -cE '^[A-Z]' "$GITHUB_WORKSPACE/ctrl/configs/xg-040g-md.diff.config") 个符号"

      # ---------- 7a. 设备上的 @daeuniverse 在线源（honk 的升级渠道）----------
      # 源列表和公钥是提交在本仓库 files/ 里的静态文件，但它们随时可能和上游脱节：
      # 对方换钥匙 → apk 验签失败；对方版本号换掉（我们写死 25.12）→ URL 404。
      # 写了源却更新不了，比没有源更糟糕（apk update 会一路报错），所以每次构建现场核对。
      - name: Verify daeuniverse apk source
        run: |
          set -euo pipefail
          K="$WORK/openwrt/files/etc/apk/keys/daeuniverse.pem"
          L="$WORK/openwrt/files/etc/apk/repositories.d/daeuniverse.list"
          [ -s "$K" ] || { echo "::error::overlay 里缺 $K"; exit 1; }
          [ -s "$L" ] || { echo "::error::overlay 里缺 $L"; exit 1; }
          head -1 "$K" | grep -q 'BEGIN PUBLIC KEY' || { echo "::error::$K 不是 PEM 公钥"; exit 1; }
          # CRLF 会让 URL 尾巴带 \r，设备上的表现是一个查不出原因的 404
          for f in "$K" "$L"; do
            a=$(wc -c < "$f"); b=$(tr -d '\r' < "$f" | wc -c)
            [ "$a" = "$b" ] || { echo "::error::$f 含 CRLF（$a vs $b 字节）"; exit 1; }
          done
          WANT=$(awk '$1 ~ /^@/ {print $2; exit}' "$L")
          [ -n "$WANT" ] || { echo "::error::$L 里没有 @… 源行"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 -I "$WANT" || echo 000)
          [ "$code" = 200 ] || { echo "::error::在线源不可达 HTTP $code：$WANT"; exit 1; }
          echo "✅ 在线源可达 $WANT"
          PIN=$(sed -n 's|^DAEUNIV_KEY_SHA256=\([0-9a-f]*\).*|\1|p' "$GITHUB_WORKSPACE/ctrl/honk-manifest.txt")
          DSHA=$(sed -n 's|^DAEUNIV_SHA=\([0-9a-f]*\).*|\1|p' "$GITHUB_WORKSPACE/ctrl/honk-manifest.txt")
          [ "${#PIN}" = 64 ] || { echo "::error::honk-manifest.txt 缺/坏 DAEUNIV_KEY_SHA256"; exit 1; }
          [ "${#DSHA}" = 40 ] || { echo "::error::honk-manifest.txt 缺/坏 DAEUNIV_SHA"; exit 1; }
          LOCAL=$(sha256sum "$K" | cut -d' ' -f1)
          [ "$LOCAL" = "$PIN" ] || { echo "::error::内置公钥 sha256 $LOCAL ≠ 锁定值 $PIN（上游换钥匙了）"; exit 1; }
          # 再和「给那个索引签名的那把钥匙」核对：feed 仓库里 keys/public-key.pem 的 git blob
          FEEDKEY=$(curl -s --max-time 25 \
            "https://raw.githubusercontent.com/daeuniverse/openwrt-packages/$DSHA/keys/public-key.pem" \
            | sha256sum | cut -d' ' -f1)
          [ "$FEEDKEY" = "$LOCAL" ] \
            || { echo "::error::内置公钥与锁定 feed(${DSHA:0:7}) 里的 keys/public-key.pem 不一致：feed=$FEEDKEY local=$LOCAL"; exit 1; }
          echo "✅ 公钥三方一致（镜像内置 / 锁定值 / feed blob）sha256=$LOCAL"

      # ---------- 7b. honk 进固件：生成 in-tree 包（二进制取官方 release 资产，
      #      由 buildroot 下载并按 PKG_HASH 校验；LuCI 侧取锁定 SHA 的源码）----------
      - name: Stage honk packages
        run: bash "$GITHUB_WORKSPACE/ctrl/scripts/stage-honk.sh" "$WORK/openwrt"

      # ---------- 8. defconfig + 硬断言 ----------
      - name: make defconfig
        run: cd "$WORK/openwrt" && make defconfig 2>&1 | tail -5

      - name: ASSERT configuration
        run: |
          set -euo pipefail
          cd "$WORK/openwrt"
          fail=0
          chk() {  # chk <期望的行> ：.config 里必须原样存在
            if ! grep -qxF "$1" .config; then echo "❌ 缺失/被改写: $1"; fail=1; fi
          }
          echo "--- BTF / eBPF（内核侧）---"
          chk 'CONFIG_KERNEL_DEBUG_INFO_BTF=y'
          chk '# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set'
          chk 'CONFIG_DWARVES=y'
          chk 'CONFIG_KERNEL_FTRACE=y'
          chk 'CONFIG_KERNEL_BPF_EVENTS=y'
          echo "--- 机型与 PON 链路 ---"
          chk 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y'
          for p in kmod-airoha-xpon kmod-airoha-pon-frontend \
                   airoha-pond airoha-ponctl luci-app-pon kmod-nft-fullcone \
                   kmod-sched-core kmod-nft-queue; do
            chk "CONFIG_PACKAGE_${p}=y"
          done
          # kmod-airoha-en7572 上游是 =m，靠 CONFIG_MODULE_DEFAULT_*=y 仍然装进镜像，
          # 并由驱动里的 AUTOLOAD:=AutoProbe 开机自动加载。所以这里容忍 y 或 m，
          # 但 =m 时必须确认 MODULE_DEFAULT 在，否则它不会进 rootfs，光前端驱动缺失。
          if grep -qx 'CONFIG_PACKAGE_kmod-airoha-en7572=m' .config; then
            chk 'CONFIG_MODULE_DEFAULT_kmod-airoha-en7572=y'
            echo "kmod-airoha-en7572 = m（由 MODULE_DEFAULT=y 装进镜像，AUTOLOAD 开机加载）"
          else
            chk 'CONFIG_PACKAGE_kmod-airoha-en7572=y'
          fi
          echo "--- 我们额外加的插件 / 主题 / honk ---"
          for p in luci-app-natmode luci-app-pon-status luci-theme-lucent \
                   honk luci-app-honk luci-lib-daeuniverse \
                   kmod-veth v2ray-geoip v2ray-geosite flock coreutils-timeout \
                   kmod-sched-bpf kmod-nfnetlink-queue kmod-nft-core kmod-nf-conntrack; do
            chk "CONFIG_PACKAGE_${p}=y"
          done
          # in-tree wrapper 包必须真存在（stage-honk.sh 生成），否则 =y 会被 defconfig 剔除
          [ -f package/custom/honk/Makefile ] || { echo "❌ 没生成 package/custom/honk/Makefile"; fail=1; }
          [ -f package/custom/luci-app-honk/Makefile ] || { echo "❌ 缺 package/custom/luci-app-honk"; fail=1; }
          # 反向检查：这些不该被任何依赖拖进来（拖进来了说明配置漂了）
          for junk in python3 ruby perl; do
            if grep -qxF "CONFIG_PACKAGE_${junk}=y" .config; then
              echo "❌ ${junk} 被意外选中 —— 本构建不该带它（会拖慢并引入 libffi 依赖坑）"; fail=1
            fi
          done
          [ "$fail" = 0 ] || { echo "::error::defconfig 后配置与预期不符，见上面 ❌ 列表"; exit 1; }
          echo "✅ 全部断言通过：$(grep -c '^CONFIG_' .config) 个符号"

      # ---------- 9a. 先单独编出 host 的 apk 工具，用它把 honk 解进 files/ ----------
      # ---------- 8b. 先单独编我们自加的包 ----------
      # 上一轮 install 参数被行内注释吃掉，是在 2 小时后的 world 编译才暴露。
      # 注意：孤立调用 make package/X/compile 时，主机件（tools/host + toolchain/host，
      # 其中含 apk/host 依赖的 lua/host、ncurses/host）的前置顺序还没建立，
      # 会报 "package/utils/lua [host] failed to build" —— 那不是真错误，是顺序问题。
      # 所以先把 world 的前半段（tools + toolchain）编出来，这一步后面 make 会复用戳，
      # 不重复花时间；然后逐包 -j1 编，失败立刻用 V=s 打真实原因。
      - name: Pre-compile our packages
        run: |
          set -euo pipefail
          cd "$WORK/openwrt"
          JOBS=$(awk -v p="$(nproc)" '/^MemAvailable:/{m=int($2/2097152)+1} END{print m<p?m:p}' /proc/meminfo)
          JOBS=$(( JOBS < 1 ? 1 : JOBS ))
          # 前置必须是 tools → toolchain → target/compile：
          # 孤立 make package/X/compile 时，带 kmod 依赖的包会去要
          # build_dir/.../linux-*/.config，而那个文件由 target/compile 生成，
          # 缺了就报 "No rule to make target ... .config / gpio-button-hotplug failed"。
          # 这三步都是 world 本来就要做的，只是提前做，不重复花时间。
          echo "=== 前置：tools / toolchain / 内核 ==="
          make tools/install -j"$JOBS" 2>&1 | tail -2
          make toolchain/install -j"$JOBS" 2>&1 | tail -2
          make target/compile -j"$JOBS" 2>&1 | tail -2
          echo "=== honk 资产：下载校验 + 解包 + 安装路径必须存在（上次断在这）==="
          make package/custom/honk/download -j1 2>&1 | tail -3
          make package/custom/honk/prepare -j1 2>&1 | tail -3
          DIST=$(sed -n 's|^HONK_DIST:=\$(PKG_BUILD_DIR)\(.*\)$|\1|p' package/custom/honk/Makefile)
          HONK_FILE=$(sed -n 's|^HONK_FILE=\(.*\)$|\1|p' "$GITHUB_WORKSPACE/ctrl/honk-manifest.txt")
          [ -n "$HONK_FILE" ] || { echo "::error::honk-manifest.txt 里取不到 HONK_FILE"; exit 1; }
          # 按 Makefile 里真正写的那个路径去要文件，不要"找一个刚好叫这名字的目录"：
          # 上一轮就是被这句放过的 —— find 在别处找到了解包目录，recipe 用的却是
          # 另一个路径，于是 install 报 cannot stat。这里把 $(BUILD_DIR) 展开成
          # build_dir/target-*，再拼 Makefile 里写的 PKG_BUILD_DIR 后缀。
          TB=$(find build_dir -maxdepth 1 -type d -name 'target-*' -print -quit)
          [ -n "$TB" ] || { echo "::error::没有 build_dir/target-*"; exit 1; }
          PBD=$(sed -n 's|^PKG_BUILD_DIR:=\$(BUILD_DIR)/\(.*\)$|\1|p' package/custom/honk/Makefile)
          [ -n "$PBD" ] || { echo "::error::读不出 PKG_BUILD_DIR 的后缀"; exit 1; }
          BD="$TB/$PBD"
          { [ -z "$DIST" ] || [ "$DIST" = "/$PBD" ]; } || {
            echo "::error::HONK_DIST 不是指向 PKG_BUILD_DIR 本身：DIST=[$DIST] PBD=[$PBD]"; exit 1; }
          [ -d "$BD" ] || { echo "::error::解包目录不在 recipe 说的位置：$BD"; find build_dir -maxdepth 2 -type d -name 'honk*' | head; exit 1; }
          for f in "$BD/$HONK_FILE" "$BD/LICENSE" package/custom/honk/files/honk.init \
                   package/custom/honk/files/honk.config package/custom/honk/files/config.dae; do
            [ -s "$f" ] || { echo "::error::生成的 honk/Makefile 要装的文件不存在: $f"; exit 1; }
          done
          echo "✅ honk 安装源齐备（$BD/$HONK_FILE $(du -h "$BD/$HONK_FILE" | cut -f1)）"
          for p in honk luci-app-honk luci-lib-daeuniverse luci-app-natmode luci-app-pon-status luci-theme-lucent; do
            if make "package/custom/$p/compile" -j1 >/dev/null 2>&1; then
              echo "✅ $p 编过"
            else
              echo "=== $p 失败，重跑 V=s 看真实原因 ==="
              make "package/custom/$p/compile" -j1 V=s 2>&1 | tail -40
              exit 1
            fi
          done
          echo "--- 产物 ---"
          # package/custom 不是 feed，按 include/feeds.mk 的 PACKAGE_SUBDIRS 归属，
          # 产物落在 bin/targets/<tail>/packages 而不是 bin/packages/<arch>/*，两处都要查。
          find bin/packages bin/targets \( -name 'honk-*.apk' -o -name 'luci-app-honk*.apk' \
               -o -name 'luci-lib-daeuniverse*.apk' -o -name 'luci-app-natmode*.apk' \
               -o -name 'luci-app-pon-status*.apk' -o -name 'luci-theme-lucent*.apk' \) 2>/dev/null | sed 's/^/  /'
          for p in honk luci-app-honk luci-lib-daeuniverse luci-app-natmode luci-app-pon-status luci-theme-lucent; do
            find bin/packages bin/targets -name "$p*.apk" 2>/dev/null | grep -q . \
              || { echo "::error::$p 没编出 .apk"; exit 1; }
          done
          echo "✅ 自加包全部编出"

      # ---------- 9. 下载 + 编译 ----------
      - name: Download packages
        run: |
          cd "$WORK/openwrt"
          for i in 1 2 3; do make download -j8 && break; sleep 5; done
          find dl -size -1024c -type f -delete 2>/dev/null || true
          echo "dl 文件数: $(ls -1 dl 2>/dev/null | wc -l)"

      - name: Compile
        run: |
          cd "$WORK/openwrt"
          JOBS=$(awk -v p="$(nproc)" '/^MemAvailable:/{m=int($2/2097152)+1} END{print m<p?m:p}' /proc/meminfo)
          echo "并行度 ${JOBS:-1}"; df -hT /
          make -j"${JOBS:-1}" || make -j1 || make -j1 V=s

      # ---------- 10. 断言：内核里真的有 .BTF 段（honk 的硬前提）----------
      - name: ASSERT kernel BTF
        run: |
          set -euo pipefail
          cd "$WORK/openwrt"
          VMLINUX=$(find build_dir -maxdepth 5 -type f -name vmlinux -path '*/linux-*/*' | head -1)
          [ -n "$VMLINUX" ] || { echo "::error::找不到 vmlinux，无法验证 BTF"; exit 1; }
          echo "vmlinux = $VMLINUX"
          readelf -S "$VMLINUX" | grep -E '\.BTF' || { echo "::error::vmlinux 里没有 .BTF 段 —— BTF 没生效"; exit 1; }
          SIZE=$(readelf -S "$VMLINUX" | awk '/\.BTF/{print strtonum("0x"$6)}' | head -1)
          echo "✅ .BTF 段存在，大小 $(( ${SIZE:-0} / 1024 / 1024 )) MB 级"
          IMG=$(find build_dir bin -type f \( -name 'Image' -o -name 'Image.gz' \) | head -1)
          [ -n "$IMG" ] && echo "内核镜像: $IMG ($(du -h "$IMG" | cut -f1))"

      # ---------- 10b. 断言：成品镜像里真的有这些功能 ----------
      # .config 里有符号 ≠ 设备里有功能（kmod 的 =m + MODULE_DEFAULT 就是这样）。
      # 直接核对产出的 .manifest 和 rootfs，才是「刷进去能不能用」的判据。
      - name: ASSERT image contents
        run: |
          set -euo pipefail
          cd "$WORK/openwrt"
          # manifest 文件名各版本不同（可能带 -rootfs 等后缀），逐级放宽，别一上来就赌名字
          MAN=$(find bin/targets/airoha/an7581 -maxdepth 2 -name '*nokia_xg-040g-md-ubi*.manifest' 2>/dev/null \
                | grep -v -- '-rootfs\.' | head -1 || true)
          [ -n "$MAN" ] || MAN=$(find bin/targets/airoha/an7581 -maxdepth 2 -name '*nokia_xg-040g-md-ubi*.manifest' 2>/dev/null | head -1 || true)
          [ -n "$MAN" ] || MAN=$(find bin/targets/airoha/an7581 -maxdepth 2 -name '*.manifest' 2>/dev/null | head -1 || true)
          if [ -z "$MAN" ]; then
            echo "----- bin/targets/airoha/an7581 实际内容 -----"
            ls -la bin/targets/airoha/an7581 | head -40
            echo "----- 所有 .manifest -----"
            find bin -name '*.manifest' | head -20
            echo "::error::找不到任何 manifest，无法核对成品包列表"
            exit 1
          fi
          echo "核对 $MAN"
          # 包列表以 rootfs 的 apk 数据库为准：那才是"镜像里到底装了什么"的权威来源。
          # manifest 有过两次误判：它是 SoC 级汇总（不含机型专属的 kmod-airoha-en7572），
          # 且 C++ 运行时在包数据库里叫 libstdc++ 而不是符号名 libstdcpp。
          # root-airoha 在 build_dir/target-*/ 下面（深度 2），-maxdepth 1 会找不到
          ROOTFS=$(find build_dir -maxdepth 2 -type d -name 'root-airoha*' | head -1)
          DB=""
          [ -n "$ROOTFS" ] && [ -f "$ROOTFS/lib/apk/db/installed" ] && DB="$ROOTFS/lib/apk/db/installed"
          [ -n "$DB" ] && echo "以 $DB 为准" || echo "::warning::没有 apk installed 库，退回用 manifest 文本判"
          MISS=""
          for p in kmod-airoha-xpon kmod-airoha-pon-frontend kmod-airoha-en7572 \
                   airoha-pond airoha-ponctl luci-app-pon luci-app-natmode \
                   luci-app-pon-status luci-theme-lucent kmod-nft-fullcone \
                   kmod-sched-core kmod-nft-queue kmod-nfnetlink-queue kmod-veth \
                   honk luci-app-honk luci-lib-daeuniverse v2ray-geosite; do
            if [ -n "$DB" ]; then
              grep -qE "^P:$p$" "$DB" || MISS="$MISS $p"
            else
              grep -qE "^${p} - " "$MAN" || MISS="$MISS $p"
            fi
          done
          [ -z "$MISS" ] || { echo "::error::成品镜像缺这些包:$MISS"; exit 1; }
          echo "✅ 成品包列表齐全（判据：${DB:-manifest}）"
          [ -n "$ROOTFS" ] || { echo "::error::找不到装配中的 rootfs（build_dir/target-*/root-airoha*）"; exit 1; }
          # honk 是解包进 rootfs 的（不是首启安装），直接查镜像装配目录里的实体文件
          MISSBIN=""
          for f in usr/bin/honk-core etc/init.d/honk etc/config/honk etc/honk/config.dae; do
            [ -s "$ROOTFS/$f" ] || MISSBIN="$MISSBIN $f"
          done
          [ -n "$MISSBIN" ] && { echo "::error::rootfs 里缺这些 honk 文件:$MISSBIN"; exit 1; }
          echo "✅ honk 已在 rootfs：$ROOTFS/usr/bin/honk-core $(du -h "$ROOTFS/usr/bin/honk-core" | cut -f1)"
          # LuCI 侧也要有，否则固件里没有配置界面
          ls "$ROOTFS"/usr/share/luci/menu.d/*honk* >/dev/null 2>&1 \
            || echo "::warning::rootfs 里没找到 honk 的 LuCI menu.d 条目（界面可能进不去，检查 luci-app-honk 载荷）"
          # files/ 覆盖层里的 apk 源与公钥也必须真的落进镜像：
          # 少了它们，设备上的 apk update 只会对着不存在的源报错（构建却是绿的）。
          MISSREPO=""
          for f in etc/apk/repositories.d/ponwrt.list etc/apk/repositories.d/daeuniverse.list \
                   etc/apk/keys/daeuniverse.pem etc/apk/repositories.d/distfeeds.list; do
            [ -s "$ROOTFS/$f" ] || MISSREPO="$MISSREPO $f"
          done
          if [ -n "$MISSREPO" ]; then
            echo "::error::rootfs 里缺这些 apk 源文件:$MISSREPO"
            ls -l "$ROOTFS/etc/apk/repositories.d" "$ROOTFS/etc/apk/keys" 2>&1 | sed 's/^/  /'
            exit 1
          fi
          echo "✅ 设备侧 apk 源与公钥已进镜像：$(grep -hE '^@' "$ROOTFS"/etc/apk/repositories.d/*.list | wc -l) 条源"
          # 内核自带 BTF，不该出现 blob 版 vmlinux-btf
          if grep -qE '^vmlinux-btf - ' "$MAN"; then
            echo "::error::成品里装了 blob 版 vmlinux-btf（我们该用 vmlinux-btf-builtin）"; exit 1
          fi

      # ---------- 10c. 失败时把小而关键的诊断文件传出来（不含 .itb）----------
      - name: Collect debug info
        if: failure()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/debug"
          B="$WORK/openwrt/bin/targets/airoha/an7581"
          cp "$B"/*.manifest "$B"/profiles.json "$B"/config.buildinfo "$B"/version.buildinfo \
             "$B"/feeds.buildinfo "$B"/sha256sums "$GITHUB_WORKSPACE/debug/" 2>/dev/null || true
          du -sh "$GITHUB_WORKSPACE/debug"; ls -1 "$GITHUB_WORKSPACE/debug" | head -20
      - name: Upload debug info
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-run-${{ github.run_id }}
          path: debug
          if-no-files-found: ignore
          retention-days: 14

      # ---------- 11. 产物 ----------
      - name: Organize firmware
        run: |
          set -euo pipefail
          cd "$WORK/openwrt/bin/targets/airoha/an7581"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -a config.buildinfo version.buildinfo feeds.buildinfo profiles.json sha256sums "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          cp -a ./*nokia_xg-040g-md*.itb ./*nokia_xg-040g-md*.manifest "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/out"

      # ---------- 11b. 包索引：镜像里写的每条源都必须真的存在 ----------
      # repositories.d/ponwrt.list 是构建前写死的，索引是构建后才有的；对不上的话
      # 设备侧表现为 apk update 报错 / 永远更新不了，而固件本身看着完全正常。
      # 所以这里把「源里列的每一条」和「本地产出的每一个 .adb」双向核对一遍。
      - name: ASSERT package indexes
        if: inputs.publish_repo == 'true'
        run: |
          set -euo pipefail
          ARCH=aarch64_cortex-a53
          PAGES="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}"
          L="$WORK/openwrt/files/etc/apk/repositories.d/ponwrt.list"
          MISS=""
          for u in $(grep -E '^@' "$L" | awk '{print $2}'); do
            case "$u" in
              "$PAGES"/*) ;;
              *) echo "::error::源地址不是本仓库 Pages：$u（期望前缀 $PAGES/）"; exit 1 ;;
            esac
            p="$WORK/openwrt/bin/${u#$PAGES/}"
            if [ -s "$p" ]; then
              echo "✅ ${u#$PAGES/}  $(du -h "$p" | cut -f1)"
            else
              MISS="$MISS $u"
            fi
          done
          # 反向：这四个 feed 空了说明该 feed 一个包都没编出来（上游改了配置结构）
          for d in base luci pon_drivers pon_userspace; do
            [ -s "$WORK/openwrt/bin/packages/$ARCH/$d/packages.adb" ] \
              || echo "::warning::feed $d 没有索引（apk add 用不了这个 feed）"
          done
          if [ -n "$MISS" ]; then
            echo "::error::镜像里写了这些源，但本次构建没产出对应索引:$MISS"
            find "$WORK/openwrt/bin" -name packages.adb | sed 's/^/    /'
            exit 1
          fi
          echo "✅ 设备侧 apk 源与本次产物一一对应"

      - name: Publish firmware to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable-xg040gmd
          name: 'XG-040G-MD 稳定版构建'
          body: |
            ## 本次构建
            | 项 | 值 |
            |---|---|
            | 基座 | `pbs05/ponwrt@${{ env.SOURCE_SHA }}` |
            | 主题 | ${{ env.HEADLINE }} |
            | SoC / profile | an7581 / `nokia_xg-040g-md-ubi` |
            | BTF | 构建末尾断言 vmlinux 含 `.BTF` |
            | 额外包 | `luci-app-natmode` `luci-app-pon-status` `luci-theme-lucent` `honk` `luci-app-honk` `luci-lib-daeuniverse` |
            | 运行 | <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}> |
            刷入前先备份原厂 `bosa` / `ri` 分区（激光校准数据 + SN/MAC，丢了救不回来）。
          files: ${{ github.workspace }}/out/*
          fail_on_unmatched_files: false

      # ---------- 12. 包仓库 → Pages（设备 apk 源）----------
      - name: Publish apk repository to Pages
        if: inputs.publish_repo == 'true'
        run: |
          set -euo pipefail
          SRC="$WORK/openwrt/bin/targets/airoha/an7581/packages"
          [ -d "$SRC" ] || { echo "::error::没有包仓库目录 $SRC"; exit 1; }
          TMP="$RUNNER_TEMP/website"
          mkdir -p "$TMP/targets/airoha/an7581/packages"
          cp -a "$SRC/." "$TMP/targets/airoha/an7581/packages/"
          # 架构级 per-feed 仓库（=m 的包只出现在这里，按需安装要靠它）
          if [ -d "$WORK/openwrt/bin/packages" ]; then
            mkdir -p "$TMP/packages"
            cp -a "$WORK/openwrt/bin/packages/." "$TMP/packages/"
          fi
          du -sh "$TMP"
          git -C "$TMP" init -q
          git -C "$TMP" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              add -A -f && git -C "$TMP" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -q -m "apk repo $SOURCE_SHA run $GITHUB_RUN_ID"
          git -C "$TMP" branch -M gh-pages
          git -C "$TMP" push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Pages enabled
        if: inputs.publish_repo == 'true'
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w '%{http_code}\n' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## 构建摘要"
            echo "- 基座 \`pbs05/ponwrt@${SOURCE_SHA}\`（pins.env 锁定）"
            echo "- 设备 profile \`nokia_xg-040g-md-ubi\`"
            echo "- 配置差异：上游 configs/an7581.config + ctrl/configs/xg-040g-md.diff.config"
            echo "- 断言：BTF/DWARVES/关键包 全部通过，vmlinux 含 .BTF"
            echo "- 固件 Release：<https://github.com/${GITHUB_REPOSITORY}/releases/tag/stable-xg040gmd>"
            echo "- apk 源：\`https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#${GITHUB_REPOSITORY_OWNER}/}/targets/airoha/an7581/packages/packages.adb\`"
          } >> "$GITHUB_STEP_SUMMARY"
